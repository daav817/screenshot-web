name: Build and Deploy Screenshot Web

"on":
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/daav817/screenshot-web

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test
        run: |
          npm ci
          npm test

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "TAG=${VERSION}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.TAG }}

      - name: Pin new image tag in k8s manifests
        run: sed -i "s/newTag: .*/newTag: ${{ steps.version.outputs.TAG }}/" k8s/kustomization.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: deploy screenshot-web ${{ steps.version.outputs.TAG }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
