apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: screenshot-web
  namespace: screenshot
  labels:
    app.kubernetes.io/name: screenshot-web
spec:
  ingressClassName: traefik
  rules:
    - host: screenshot.energiapower.llc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: screenshot-web
                port:
                  name: http
