apiVersion: apps/v1
kind: Deployment
metadata:
  name: screenshot-web
  namespace: screenshot
  labels:
    app.kubernetes.io/name: screenshot-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: screenshot-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: screenshot-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/daav817/screenshot-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: ghcr-pull-secret
